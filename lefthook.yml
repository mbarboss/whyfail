# lefthook is pinned in its own module and runs through `go tool`, which builds
# it in a temporary directory. Without this line the installed hook would call
# that temporary path, which is gone once `task hooks` returns. Git runs hooks
# from the root of the working tree, so the relative modfile path holds.
lefthook: go tool -modfile=tools/lefthook/go.mod lefthook

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.go"
      run: go tool -modfile=tools/golangci-lint/go.mod golangci-lint fmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.go"
      run: go run ./tools/task lint
    - name: secrets
      run: go tool -modfile=tools/gitleaks/go.mod gitleaks git --pre-commit --staged --redact --no-banner
    - name: large-files
      run: go run ./tools/task large-files {staged_files}
